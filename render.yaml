# Render Blueprint — CodeAtreus backend (single-service v1 topology).
#
# One web service runs the API; indexing runs IN-PROCESS (dispatch.py thread
# fallback) rather than a separate Celery worker: the clone->index->serve
# handoff needs one shared filesystem. Chroma runs in local-file mode.
# Neon provides (persistent) Postgres; Vercel serves the frontend.
#
# FREE TIER: no persistent disk, so cloned repos and the Chroma index are
# EPHEMERAL — wiped on restart / idle spin-down. Re-index a repo after a cold
# start to restore chat/search. For always-on storage, switch plan to `starter`
# and add a `disk:` mounted at /app/data (then repos/Chroma survive restarts).
#
# Deploy: push this file, then in the Render dashboard: New > Blueprint, pick
# this repo. Fill the `sync: false` secrets when prompted.
services:
  - type: web
    name: codeatreus-api
    runtime: docker
    plan: free               # no persistent disk; filesystem is EPHEMERAL
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: oregon
    healthCheckPath: /api/health
    # Free tier has no pre-deploy step, so run migrations at container start
    # before uvicorn (safe here: a single free instance, no replica race).
    # dockerCommand overrides the Dockerfile CMD; it binds Render's $PORT.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      # Frontend origin (Vercel). Adjust if your Vercel project name differs.
      - key: CORS_ORIGINS
        value: https://codeatreus.vercel.app
      # Vector store + clones live on the ephemeral filesystem (wiped on
      # restart/spin-down on free tier). Postgres data persists in Neon.
      - key: CHROMA_MODE
        value: local
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma
      - key: CLONE_DIR
        value: /app/data/repos
      # Modest client-side pool; single service against Neon's pooler.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      # GitHub OAuth redirect must point at the deployed frontend callback.
      - key: GITHUB_OAUTH_REDIRECT_URI
        value: https://codeatreus.vercel.app/login/callback
      # Render auto-generates a strong value and keeps it stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      # --- Secrets: paste these in the Render dashboard (never committed) ---
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
